<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opsamling | J-Cosplay</title>
  <script> /*stopper forkert tema fra at blive kørt */
    (() => {
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch { }
    })();
  </script>
  <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">J-Cosplay | Scene Creator</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Frontpage</a></li>
          <li><a href="./svg.html" aria-current="page">Scene Creator</a></li>
          <li><a href="./form.html">Application</a></li>
        </ul>
      </nav>
    </div>
  </header>
  </header>

  <main>
    <section class="opsamling-page">
      <div class="opsamling-intro">
        <h1>Din Tilmelding</h1>
        <div class="actions">
          <a class="button" href="./form.html">Tilbage til formular</a>
        </div>
      </div>
      <section class="event-pass">
        <section class="data">
          <div class="personal-info-member-1">
            <h3>Group Member 1</h3>
            <p>Name: <span id="member-name-1"></span></p>
            <p>Cosplay Alias: <span id="member-alias-1"></span></p>
            <p>Pronouns: <span id="member-pron-1"></span></p>
            <p>Age: <span id="member-age-1"></span></p>
            <p>E-mail: <span id="member-mail-1"></span></p>
          </div>
          <div class="character-info-member-1">
            <p>Character: <span id="member-character-1"></span></p>
            <p>Serier: <span id="member-series-1"></span></p>
            <img id="member-reference-1" src="img/default.png" alt="">
            <p>Source:<span id="member-source-1"></span></p>
          </div>

        </section>
      </section>

      <article class="opsamling-placeholder"></article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>J-Cos</p>
      <button type="button" id="theme-toggle" aria-pressed="false" aria-label="Switch Themes">Dark</button>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
